<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account · Aarika</title>
<link rel="stylesheet" href="../css/my_account.css">
</head>
<body>

<!-- Icon sprite: all icons defined once, used via <use href="#i-name"> rest jus refence them -->

     <svg style="display:none" aria-hidden="true">

  
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
  
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></symbol>
  <symbol id="i-user-fill" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="8" r="4.2"/><path d="M4 20.5c0-4.7 3.6-7.3 8-7.3s8 2.6 8 7.3v.5H4v-.5Z"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5.5 4h3l1.4 3.8-2.1 1.4a11.5 11.5 0 0 0 5 5l1.4-2.1L18 12.5v3a2 2 0 0 1-2 2C9.9 17.5 4.5 12.1 4.5 6a2 2 0 0 1 1-2Z"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.3"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-9.5-9.3C1.2 7 3.4 4 6.7 4 9 4 10.7 5.3 12 7c1.3-1.7 3-3 5.3-3 3.3 0 5.5 3 4.2 6.7C19.5 15.4 12 20 12 20Z"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M3 8 12 4l9 4-9 4-9-4Z"/><path d="M3 8v9l9 4 9-4V8"/><path d="M12 12v9"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3Z"/><path d="M14 6.5l3 3"/></symbol>
  <symbol id="i-signout" viewBox="0 0 24 24"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"/><path d="M15 16l4-4-4-4"/><path d="M19 12H9"/></symbol>
</svg>

<main class="account-page">
  <div class="account-card">

    <header class="account-header">
      <img class="brand-logo" src="../photos/logo_my_account.png" alt="Aarika — since 2026">
      <h1>My Account</h1>
      <p class="subtitle">Manage your account information and preferences.</p>
    </header>

    <section class="profile-summary" aria-label="Profile">
      <div class="avatar"><svg class="icon avatar-icon"><use href="#i-user-fill"/></svg></div>
      <h2 class="profile-name">Aarika User</h2>
      <p class="member-since">Member since May 2024</p>
    </section>

    
    <section class="field-group" aria-label="Account details">

      <div class="field-row">
        <svg class="icon field-icon"><use href="#i-user"/></svg>
        <div class="field-text">
          <span class="field-label">Username</span>
          <span class="field-value">Aarika User</span>
        </div>
        <button class="field-action field-action--chevron" type="button" data-action="open-username" aria-label="Open username">
          <svg class="icon icon-sm"><use href="#i-chevron"/></svg>
        </button>
        <button class="field-action field-action--edit" type="button" data-action="edit-username">
          <svg class="icon icon-sm"><use href="#i-pencil"/></svg><span>Edit</span>
        </button>
      </div>

      <div class="field-row">
        <svg class="icon field-icon"><use href="#i-calendar"/></svg>
        <div class="field-text">
          <span class="field-label">Age</span>
          <span class="field-value">19</span>
        </div>
        <button class="field-action field-action--chevron" type="button" data-action="open-age" aria-label="Open age">
          <svg class="icon icon-sm"><use href="#i-chevron"/></svg>
        </button>
        <button class="field-action field-action--edit" type="button" data-action="edit-age">
          <svg class="icon icon-sm"><use href="#i-pencil"/></svg><span>Edit</span>
        </button>
      </div>

      <div class="field-row">
        <svg class="icon field-icon"><use href="#i-phone"/></svg>
        <div class="field-text">
          <span class="field-label">Phone Number</span>
          <span class="field-value">+91 98765 43210</span>
        </div>
        <button class="field-action field-action--chevron" type="button" data-action="open-phone" aria-label="Open phone number">
          <svg class="icon icon-sm"><use href="#i-chevron"/></svg>
        </button>
        <button class="field-action field-action--edit" type="button" data-action="edit-phone">
          <svg class="icon icon-sm"><use href="#i-pencil"/></svg><span>Edit</span>
        </button>
      </div>

      <div class="field-row">
        <svg class="icon field-icon"><use href="#i-pin"/></svg>
        <div class="field-text">
          <span class="field-label">Address</span>
          <span class="field-value">Bangalore, Karnataka, India</span>
        </div>
        <button class="field-action field-action--chevron" type="button" data-action="open-address" aria-label="Open address">
          <svg class="icon icon-sm"><use href="#i-chevron"/></svg>
        </button>
        <button class="field-action field-action--edit" type="button" data-action="edit-address">
          <svg class="icon icon-sm"><use href="#i-pencil"/></svg><span>Edit</span>
        </button>
      </div>

      <div class="field-row">
        <svg class="icon field-icon"><use href="#i-lock"/></svg>
        <div class="field-text">
          <span class="field-label">Password</span>
          <span class="field-value">••••••••</span>
        </div>
        <button class="field-action field-action--chevron" type="button" data-action="open-password" aria-label="Open password">
          <svg class="icon icon-sm"><use href="#i-chevron"/></svg>
        </button>
        <button class="field-action field-action--edit" type="button" data-action="edit-password">
          <svg class="icon icon-sm"><use href="#i-pencil"/></svg><span>Edit</span>
        </button>
      </div>

    </section>

  
    <nav class="link-group" aria-label="Account links">

      <a href="../index.html" class="link-row" style="text-decoration: none;">
        <svg class="icon field-icon"><use href="#i-home"/></svg>
        <span class="link-label">Back to Home</span>
        <svg class="icon icon-sm"><use href="#i-chevron"/></svg>
      </a>
      
      <a href="../html/Wishlist.html" class="link-row" style="text-decoration: none;">
        <svg class="icon field-icon"><use href="#i-heart"/></svg>
        <span class="link-label">Wishlist</span>
        <svg class="icon icon-sm"><use href="#i-chevron"/></svg>
      </a>

      <a href="../html/Cart.html" class="link-row" style="text-decoration: none;">
        <svg class="icon field-icon"><use href="#i-box"/></svg>
        <span class="link-label">My Orders</span>
        <svg class="icon icon-sm"><use href="#i-chevron"/></svg>
      </a>

      
    </nav>

    <button class="signout-btn" type="button" data-action="sign-out">
      <svg class="icon icon-sm"><use href="#i-signout"/></svg>
      <span>Sign Out</span>
    </button>

    <p class="help-text">Need help? <a href="../html/Contact.html" data-action="contact-us">Contact us</a></p>


    
  </div>
</main>

</body>
</html>
