<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | AARIKA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">
  <main class="authentication-page">
    <section class="authentication-card authentication-card--wide">
      <img
        src="../photos/logo_my_account.png"
        alt="AARIKA"
        class="auth-logo"
      >

      <h1 class="auth-heading">Create your account</h1>
      <p class="auth-subtext">Sign up to get started with Aarika.</p>

      <form id="signup-form" class="auth-form" action="#" method="post">

        <div class="form-row form-row--two">
          <div class="form-group">
            <label for="signup-username">Username</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="10" cy="6.5" r="3.2" stroke="currentColor" stroke-width="1.4"/>
                  <path d="M3.5 17c0-3.5 3-5.8 6.5-5.8s6.5 2.3 6.5 5.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
              </span>
              <input
                type="text"
                id="signup-username"
                name="username"
                placeholder="Enter your username"
                autocomplete="username"
                required
              >
            </div>
          </div>

          <div class="form-group">
            <label for="signup-age">Age <span class="label-optional">(Optional)</span></label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="2.5" y="4" width="15" height="13" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
                  <path d="M2.5 8H17.5" stroke="currentColor" stroke-width="1.4"/>
                  <path d="M6 2.5V5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                  <path d="M14 2.5V5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
              </span>
              <input
                type="number"
                id="signup-age"
                name="age"
                placeholder="Enter your age"
                min="0"
                max="120"
              >
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="signup-email">Email</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="2.5" y="4.5" width="15" height="11" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
                <path d="M3 5.5L10 11L17 5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <input
              type="email"
              id="signup-email"
              name="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="signup-password">Password</label>
          <div class="input-wrapper has-toggle">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="9" width="12" height="8" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
                <path d="M6.5 9V6.5a3.5 3.5 0 0 1 7 0V9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </span>
            <input
              type="password"
              id="signup-password"
              name="password"
              placeholder="Create a password"
              autocomplete="new-password"
              required
            >
            <button
              type="button"
              class="password-toggle"
              id="signup-password-toggle"
              aria-label="Show password"
            >
              <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1.5 10C1.5 10 4.5 4.5 10 4.5C15.5 4.5 18.5 10 18.5 10C18.5 10 15.5 15.5 10 15.5C4.5 15.5 1.5 10 1.5 10Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.4"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="signup-address">Address</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 18C10 18 15.5 12.6 15.5 8.3C15.5 5.1 13 2.5 10 2.5C7 2.5 4.5 5.1 4.5 8.3C4.5 12.6 10 18 10 18Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                <circle cx="10" cy="8.2" r="2.1" stroke="currentColor" stroke-width="1.4"/>
              </svg>
            </span>
            <input
              type="text"
              id="signup-address"
              name="address"
              required
              placeholder="Enter your address"
              autocomplete="street-address"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="signup-phone">Phone Number</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 3.5H7L8.5 7L6.5 8.5C7.3 10.3 8.7 11.7 10.5 12.5L12 10.5L15.5 12V15C15.5 15.8 14.8 16.5 14 16.4C8.3 16 3.5 11.2 3.6 5.5C3.6 4.7 4 3.5 4 3.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
              </svg>
            </span>
            <input
              type="tel"
              id="signup-phone"
              name="phone"
              required
              placeholder="Enter your phone number"
              autocomplete="tel"
            >
          </div>
        </div>

        <div id="form-error" class="form-error" role="alert" hidden></div>

        <button type="submit" class="auth-button" id="signup-button">Sign Up</button>
      </form>

      <p class="account-switch">Already have an account? <a href="../html/Login.html">Log in</a></p>
    </section>
  </main>
</body>
</html>
